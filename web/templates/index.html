<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rembg - Background Removal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Rembg</h1>
            <p>Instantly remove image backgrounds</p>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <p>Drag & Drop an image here<br>or <span class="highlight">Click to Upload</span></p>
                <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" hidden>
            </div>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Removing background...</p>
            </div>

            <div id="result-container" class="hidden">
                <h2>Result</h2>
                <img id="result-image" alt="Processed Image">
                <button id="download-btn" class="glass-btn">Download Image</button>
                <button id="reset-btn" class="glass-btn secondary">Try Another</button>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
