[Network]
port = 5050

[Dev]
# Change this to false to simulate a Guest user, or true to simulate a Logged-In user.
simulate_logged_in_user = true

[UPLOADS]
# Matches Portfolio standard (upload_path, max_file_size_mb)
upload_path = E:\Oracle\Portfolio download
max_file_size_mb = 10

[Retention]
# How long to keep guest images (in minutes)
guest_retention_minutes = 60
# How long to keep logged in user images (in minutes)
logged_in_retention_minutes = 1440

[POSTGRES]
# For local dev without Postgres running, we can still fall back to SQLite in the app.py logic,
# but the config standard remains the same.
host = localhost
port = 5432
database = synora_portfolio
username = synora_user
password = @RE@nsn@123

[Telemetry]
otlp_endpoint = http://localhost:4317
